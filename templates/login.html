{% extends 'base.html' %}
{% block title %}Iniciar Sesión{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">🛒 <span>MASS</span></div>
    <h2>Iniciar Sesión</h2>
    <p class="auth-sub">Accede a tu cuenta</p>

    <form method="POST" class="auth-form">
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" name="email" required placeholder="tucorreo@ejemplo.com" />
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <div class="input-pass">
          <input type="password" name="password" id="passInput" required placeholder="••••••••" />
          <button type="button" onclick="togglePass('passInput', this)">👁️</button>
        </div>
      </div>
      <button type="submit" class="btn-auth">Iniciar Sesión</button>
    </form>

    <div class="auth-divider"><span>o</span></div>

    <div class="auth-links">
      <a href="{{ url_for('recuperar_password') }}">¿Olvidaste tu contraseña?</a>
      <span>•</span>
      <a href="{{ url_for('register') }}">Crear cuenta</a>
    </div>

    <div class="auth-note">
      <strong>Admin:</strong> admin@mass.com / admin123
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function togglePass(id, btn) {
  const i = document.getElementById(id);
  i.type = i.type === 'password' ? 'text' : 'password';
  btn.textContent = i.type === 'password' ? '👁️' : '🙈';
}
</script>
{% endblock %}
