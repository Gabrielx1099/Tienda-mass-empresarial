{% extends 'base.html' %}
{% block title %}Recuperar Contraseña{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">🛒 <span>MASS</span></div>
    <h2>Recuperar Contraseña</h2>
    <p class="auth-sub">Ingresa tu correo y te enviaremos instrucciones (simulado).</p>
    <form method="POST" class="auth-form">
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" name="email" required placeholder="tucorreo@ejemplo.com" />
      </div>
      <button type="submit" class="btn-auth">Enviar Instrucciones</button>
    </form>
    <div class="auth-links">
      <a href="{{ url_for('login') }}">← Volver al Login</a>
    </div>
    <div class="auth-note">⚠️ Función simulada para fines académicos. No se envía ningún correo real.</div>
  </div>
</div>
{% endblock %}
